services:
	db:
		image: postgres:16-alpine
		environment:
			POSTGRES_DB: knowledge_hub
			POSTGRES_USER: postgres
			POSTGRES_PASSWORD: postgres
		ports:
			- "5432:5432"
		volumes:
			- postgres_dev_data:/var/lib/postgresql/data

	ollama:
		image: ollama/ollama:latest
		ports:
			- "11434:11434"
		volumes:
			- ollama_dev_data:/root/.ollama

	backend:
		build: ./backend
		environment:
			DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_hub
			SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
			OLLAMA_HOST: http://ollama:11434
			LLM_MODEL: ${LLM_MODEL:-deepseek-r1:1.5b}
			SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-qwen3.5:0.8b}
		volumes:
			- ./backend:/app
			- ./data:/app/data
			- ./vectorstore:/app/vectorstore
		ports:
			- "8002:8002"
		depends_on:
			- db

	frontend:
		image: node:22-alpine
		working_dir: /app
		environment:
			VITE_API_BASE_URL: http://localhost:8002/api
		volumes:
			- ./frontend:/app
			- frontend_node_modules:/app/node_modules
		command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
		ports:
			- "5173:5173"
		depends_on:
			- backend

volumes:
	postgres_dev_data:
	ollama_dev_data:
	frontend_node_modules:
